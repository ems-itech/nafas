services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - .env.local
    volumes:
      - ./:/app
      - web_next_cache:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nafas
      POSTGRES_PASSWORD: nafas
      POSTGRES_DB: nafas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nafas -d nafas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  web_next_cache:
  postgres_data:
